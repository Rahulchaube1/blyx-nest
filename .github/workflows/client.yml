name: Release Nest CLI
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - run: go test ./...
      - run: go run ./cmd/nest --version
  release:
    needs: native
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - run: python3 registry/build_client.py "${GITHUB_REF_NAME#v}"
      - name: Publish tested clients and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Blyx Nest CLI $GITHUB_REF_NAME" --notes "Download the client for your operating system, extract nest or nest.exe and run nest --help. SHA256SUMS covers every archive. Installation guide: https://www.blyx-lang.space/nest/install.html" *.zip *.tar.gz SHA256SUMS
